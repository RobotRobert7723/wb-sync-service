[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wb-postgres-sync"
version = "0.1.0"
description = "Multi-account Wildberries API ingester for PostgreSQL"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "psycopg[binary]>=3.3,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=9,<10",
]

[project.scripts]
wb-sync = "wb_sync.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
